<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase 2 Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1d1b2b; --felt: #26404a; --felt-edge: #1b2f37; --fg: #f4f1ea; --muted: #b9b3c9;
  --card: #fffaf0; --ink: #2a2530; --cons: #3f7fd9; --vowel: #d9534f; --dig: #d9a21c;
  --hp: #4cc38a; --hp-low: #e8574a; --accent: #a28cff; --glow: #ffe27a;
  --panel: #2c2940; --line: #44405c;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 17px/1.4 "Andika", system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
button { font: inherit; cursor: pointer; }
#game { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; max-width: 1100px; margin: 0 auto; padding: 10px 16px; gap: 8px; }

/* Player strips */
.strip { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; }
.who { display: flex; align-items: center; gap: 12px; min-width: 260px; }
.avatar { font-size: 54px; width: 72px; height: 72px; display: grid; place-items: center; background: var(--panel); border-radius: 50%; border: 3px solid var(--line); transition: transform .1s; }
.avatar.hit { animation: shake .45s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-9px) rotate(-4deg); } 40% { transform: translateX(8px) rotate(3deg); } 60% { transform: translateX(-5px); } 80% { transform: translateX(4px); } }
.name { font-weight: 700; font-size: 19px; }
.hpbar { width: 180px; height: 16px; background: #0004; border-radius: 9px; overflow: hidden; border: 1px solid #0006; }
.hpbar > div { height: 100%; background: var(--hp); transition: width .6s ease, background .3s; }
.hpbar.low > div { background: var(--hp-low); }
.hptext { font-size: 14px; color: var(--muted); }
.status { font-size: 14px; color: var(--glow); min-height: 20px; }

/* Hands */
.hand { display: flex; gap: 8px; min-width: 0; justify-content: center; align-items: flex-end; min-height: 130px; }
.opp-hand { min-height: 70px; }
.card { position: relative; flex: 0 1 92px; min-width: 64px; width: 92px; height: 128px; border-radius: 12px; background: var(--card); color: var(--ink); display: grid; place-items: center; box-shadow: 0 4px 0 #0005; border: 4px solid var(--cons); transition: transform .15s, box-shadow .15s, opacity .3s; }
.card.vowel { border-color: var(--vowel); }
.card.digraph { border-color: var(--dig); }
.card .glyph { font-size: 52px; font-weight: 700; line-height: 1; margin-top: -6px; }
.card .dmg { position: absolute; bottom: 5px; left: 7px; font-size: 14px; font-weight: 700; }
.card .fx { position: absolute; bottom: 4px; right: 6px; font-size: 16px; }
.card .tag { position: absolute; top: 4px; left: 0; right: 0; text-align: center; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: #8a8394; }
.hand.mine .card:hover { transform: translateY(-10px); }
.hand.mine.active .card { cursor: pointer; }
.card.picked { transform: translateY(-18px); box-shadow: 0 0 0 4px var(--glow), 0 8px 0 #0005; }
.card.fits::after { content: "+3"; position: absolute; top: -10px; right: -10px; background: var(--glow); color: var(--ink); font-size: 13px; font-weight: 700; border-radius: 10px; padding: 1px 6px; }
.back { width: 46px; height: 64px; border-radius: 8px; background: repeating-linear-gradient(45deg, #5b4aa8 0 6px, #4b3c90 6px 12px); border: 3px solid #cfc6ff55; box-shadow: 0 3px 0 #0005; }
.card.new { animation: pop .35s; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* Table */
#table { position: relative; background: radial-gradient(ellipse at center, var(--felt) 0%, var(--felt-edge) 100%); border-radius: 26px; border: 3px solid #0005; display: grid; grid-template-columns: 170px 1fr 170px; align-items: center; padding: 14px; min-height: 0; }
.cue { justify-self: center; width: 140px; background: var(--card); color: var(--ink); border-radius: 12px; padding: 10px 8px; text-align: center; box-shadow: 0 4px 0 #0005; border: 3px solid var(--glow); }
.cue .pic { font-size: 46px; line-height: 1.1; }
.cue .word { font-size: 28px; font-weight: 700; letter-spacing: .04em; }
.cue .gap { display: inline-block; min-width: 26px; border-bottom: 4px solid var(--ink); margin: 0 3px; height: 30px; vertical-align: -6px; }
.cue .gap.wide { min-width: 48px; }
.cue .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #8a8394; }
.cue .left { font-size: 11px; color: #8a8394; }
.cue.flash { animation: flash .7s; }
@keyframes flash { 50% { box-shadow: 0 0 0 10px var(--glow); } }
.cue.done { opacity: .5; border-color: #aaa; }
#center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; height: 100%; }
#slot { width: 112px; height: 154px; border-radius: 14px; border: 3px dashed #ffffff33; display: grid; place-items: center; }
#slot .card { width: 104px; height: 146px; }
#slot .card .glyph { font-size: 60px; }
#msg { font-size: 22px; text-align: center; min-height: 32px; max-width: 520px; text-shadow: 0 2px 0 #0006; }
#actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; min-height: 48px; }
.btn { background: var(--accent); color: #1d1b2b; border: 0; border-radius: 12px; padding: 10px 18px; font-weight: 700; font-size: 18px; box-shadow: 0 3px 0 #0006; }
.btn.alt { background: #e8e3f5; }
.btn.warn { background: var(--glow); }
.btn:disabled { opacity: .45; cursor: default; }
.deckinfo { position: absolute; bottom: 8px; right: 14px; font-size: 13px; color: var(--muted); }

/* Energy burst */
.burst { position: fixed; width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle, #fff 0%, var(--glow) 40%, #ff9a3c 70%, transparent 72%); pointer-events: none; z-index: 50; box-shadow: 0 0 30px 12px #ffd25a99; }
.dmgnum { position: fixed; font-size: 40px; font-weight: 700; color: var(--glow); text-shadow: 0 3px 0 #000a; pointer-events: none; z-index: 51; animation: floatup 1.1s forwards; }
@keyframes floatup { to { transform: translateY(-60px); opacity: 0; } }

/* Overlay (trace pad, speak step, start, end) */
#overlay { position: fixed; inset: 0; background: #0b0a12cc; display: none; place-items: center; z-index: 40; }
#overlay.show { display: grid; }
.panel { background: var(--panel); border: 2px solid var(--line); border-radius: 20px; padding: 18px 22px 20px; width: min(640px, calc(100vw - 32px)); text-align: center; box-shadow: 0 10px 40px #000a; }
.panel h2 { margin: 0 0 4px; font-size: 26px; }
.panel .prompt { font-size: 22px; min-height: 32px; margin: 6px 0 10px; }
.panel .sub { color: var(--muted); font-size: 15px; }
.pad { display: flex; gap: 6px; justify-content: center; background: var(--card); border-radius: 16px; padding: 6px; touch-action: none; }
.pad svg { height: min(52vh, 380px); touch-action: none; cursor: crosshair; }
.guide path { fill: none; stroke: #d9d3c7; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
.guide path.done { stroke: #7cc79a; }
.guide circle.dotg { fill: #d9d3c7; } .guide circle.dotg.done { fill: #7cc79a; }
.lines line { stroke: #c9c2b4; stroke-width: 1; stroke-dasharray: 4 4; }
.lines line.base { stroke-dasharray: none; stroke: #b5ad9e; }
.markers circle { fill: #6b4fd8; } .markers text { fill: #fff; font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; font-family: system-ui; }
.markers g.next circle { fill: #e8574a; animation: pulse 1s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 50% { transform: scale(1.35); } }
.ink path { fill: none; stroke: #3b2f7a; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.anim circle { fill: #e8574a; } .anim path { fill: none; stroke: #e8574a88; stroke-width: 9; stroke-linecap: round; }
.mic { display: inline-flex; align-items: center; gap: 8px; font-size: 18px; padding: 8px 16px; border-radius: 30px; background: #0003; margin: 8px 0; }
.mic .dot { width: 14px; height: 14px; border-radius: 50%; background: #777; }
.mic.on .dot { background: #e8574a; animation: pulse 1s infinite; }
.bigcard { display: flex; justify-content: center; margin: 6px 0 4px; }
.taps { display: flex; gap: 14px; justify-content: center; margin-top: 10px; }
.tapopt { width: 74px; height: 74px; border-radius: 50%; border: 4px solid #fff3; background: #3a3655; color: #fff; font-size: 30px; }
.tapopt.ringed { border-color: var(--glow); box-shadow: 0 0 0 4px #ffe27a55; }
.tapopt.pulse { animation: pulse 1s infinite; }
.rowbtns { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }

/* Debug */
#debug { position: fixed; right: 8px; bottom: 8px; width: 320px; max-height: 46vh; overflow: auto; background: #000c; color: #cfc; font: 12px/1.35 ui-monospace, monospace; padding: 8px; border-radius: 8px; z-index: 60; display: none; }
#debug button { font: 12px ui-monospace, monospace; margin: 2px; }
#debug .log div { border-top: 1px solid #333; padding: 2px 0; }
</style>
</head>
<body>
<div id="game">
  <div class="strip" id="oppStrip">
    <div class="who">
      <div class="avatar" id="oppAvatar">🦉</div>
      <div>
        <div class="name">Rival Rook</div>
        <div class="hpbar" id="oppHpBar"><div style="width:100%"></div></div>
        <div class="hptext" id="oppHpText">20 / 20</div>
        <div class="status" id="oppStatus"></div>
      </div>
    </div>
    <div class="hand opp-hand" id="oppHand"></div>
    <div style="min-width:120px"></div>
  </div>

  <div id="table">
    <div><div class="cue" id="oppCue"></div></div>
    <div id="center">
      <div id="slot"></div>
      <div id="msg"></div>
      <div id="actions"></div>
    </div>
    <div><div class="cue" id="myCue"></div></div>
    <div class="deckinfo" id="deckInfo"></div>
  </div>

  <div class="strip" id="myStrip">
    <div class="who">
      <div class="avatar" id="myAvatar">🧒</div>
      <div>
        <div class="name">You</div>
        <div class="hpbar" id="myHpBar"><div style="width:100%"></div></div>
        <div class="hptext" id="myHpText">20 / 20</div>
        <div class="status" id="myStatus"></div>
      </div>
    </div>
    <div class="hand mine" id="myHand"></div>
    <div style="min-width:120px"></div>
  </div>
</div>

<div id="overlay"><div class="panel" id="panel"></div></div>
<div id="debug"><div><b>debug</b> <button id="dbgSkip">skip step</button> <button id="dbgWin">opp hp→1</button></div><pre id="dbgState"></pre><div class="log" id="dbgLog"></div></div>

<script src="../../shared/trace-engine.js"></script>
<script src="../../shared/speech-letters.js"></script>
<script src="../../shared/speech-sounds.js"></script>
<script>
'use strict';
/* =====================================================================
   Phase 2 battle demo. Spec: docs/specs/phase-2-battle.md
   Params: ?speech=off  ?seed=123  ?debug=1  ?loose=1.5
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const DEBUG = Q.get('debug') === '1';
let SPEECH = Q.get('speech') !== 'off';
const LOOSE = parseFloat(Q.get('loose') || '1.5');

/* ---------- utilities ---------- */
function mulberry32(seed) { let t = seed >>> 0; return () => { t += 0x6D2B79F5; let r = Math.imul(t ^ (t >>> 15), 1 | t); r ^= r + Math.imul(r ^ (r >>> 7), 61 | r); return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; }
const rng = Q.get('seed') ? mulberry32(+Q.get('seed')) : Math.random;
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = (ms) => new Promise(r => setTimeout(r, ms * (window.__fast ? 0.05 : 1)));
const $ = (s) => document.querySelector(s);
const SVG_NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs = {}, parent) { const e = document.createElementNS(SVG_NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (parent) parent.appendChild(e); return e; }
function h(tag, attrs = {}, ...kids) { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); } for (const k of kids) e.append(k); return e; }

/* ---------- content (spec: Content) ---------- */
const CARD_DEFS = {
  m:  { type: 'consonant', dmg: 3, name: 'em',        nameTts: 'em',          sound: '/m/',  soundTts: 'mmmm' },
  s:  { type: 'consonant', dmg: 3, name: 'es',        nameTts: 'ess',         sound: '/s/',  soundTts: 'sssss' },
  t:  { type: 'consonant', dmg: 3, name: 'tee',       nameTts: 'tee',         sound: '/t/',  soundTts: 'tuh' },
  p:  { type: 'consonant', dmg: 3, name: 'pee',       nameTts: 'pee',         sound: '/p/',  soundTts: 'puh', fx: 'pause' },
  n:  { type: 'consonant', dmg: 3, name: 'en',        nameTts: 'en',          sound: '/n/',  soundTts: 'nnnn' },
  c:  { type: 'consonant', dmg: 3, name: 'see',       nameTts: 'see',         sound: '/k/',  soundTts: 'kuh' },
  a:  { type: 'vowel',     dmg: 4, name: 'ay',        nameTts: 'ay',          sound: '/a/',  soundTts: 'aah, as in apple' },
  i:  { type: 'vowel',     dmg: 4, name: 'eye',       nameTts: 'eye',         sound: '/i/',  soundTts: 'ih, as in itch' },
  sh: { type: 'digraph',   dmg: 5, name: 'es aitch',  nameTts: 'ess, aitch',  sound: '/sh/', soundTts: 'shhhh', fx: 'shush' },
  ee: { type: 'digraph',   dmg: 5, name: 'ee ee',     nameTts: 'ee, ee',      sound: '/ee/', soundTts: 'eeee' }
};
const FX = { pause: { icon: '⏸️', label: 'Pause', text: 'skips their next turn' }, shush: { icon: '🤫', label: 'Shush', text: 'discards a card' } };
const CUE_POOL = [
  { pre: '',   post: 'at', fits: 'c',  pic: '🐱', word: 'cat' },
  { pre: 'm',  post: 'p',  fits: 'a',  pic: '🗺️', word: 'map' },
  { pre: 'p',  post: 'n',  fits: 'i',  pic: '📌', word: 'pin' },
  { pre: '',   post: 'ip', fits: 'sh', pic: '🚢', word: 'ship' },
  { pre: 'b',  post: '',   fits: 'ee', pic: '🐝', word: 'bee' },
  { pre: '',   post: 'nt', fits: 'a',  pic: '🐜', word: 'ant' },
  { pre: '',   post: 'an', fits: 'p',  pic: '🍳', word: 'pan' },
  { pre: 's',  post: 't',  fits: 'i',  pic: '🪑', word: 'sit' },
  { pre: '',   post: 'un', fits: 's',  pic: '☀️', word: 'sun' },
  { pre: 'pa', post: '',   fits: 'n',  pic: '🍳', word: 'pan' }
];
const MAX_HP = 20, HAND = 5, CUE_BONUS = 3;

/* ---------- engines ---------- */
let TE, SL, SS;
async function loadEngines() {
  const strokes = await fetch('../../shared/strokes-lowercase.json').then(r => r.json());
  TE = TraceEngine.create(strokes, { looseness: LOOSE });
  SL = SpeechLetters.create(TE.letters);
  SS = SpeechSounds.create(SL);
}
const lettersOf = (id) => id.length === 2 ? id.split('') : [id];

/* ---------- debug ---------- */
function dlog(...a) { if (!DEBUG) return; const d = h('div', {}, a.map(x => typeof x === 'string' ? x : JSON.stringify(x)).join(' ')); $('#dbgLog').prepend(d); }
let skipResolver = null;
function setSkip(fn) { skipResolver = fn; }
if (DEBUG) {
  $('#debug').style.display = 'block';
  $('#dbgSkip').onclick = () => { if (skipResolver) { const f = skipResolver; skipResolver = null; f(); } };
  $('#dbgWin').onclick = () => { G.opp.hp = 1; render(); };
}

/* ---------- voice (speechSynthesis) ---------- */
const Voice = {
  voice: null,
  init() {
    if (!('speechSynthesis' in window)) return;
    const pick = () => { const v = speechSynthesis.getVoices().filter(x => /^en/i.test(x.lang)); const pref = [/google us english/i, /natural/i, /samantha/i, /aria/i, /jenny/i, /zira/i]; for (const p of pref) { const f = v.find(x => p.test(x.name)); if (f) return f; } return v[0] || null; };
    this.voice = pick(); speechSynthesis.onvoiceschanged = () => { this.voice = pick(); };
  },
  say(text, opts = {}) {
    dlog('🔈', text);
    if (window.__fast || !('speechSynthesis' in window)) return sleep(150);
    return new Promise(res => {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); if (this.voice) u.voice = this.voice; u.rate = opts.rate || 0.92; u.pitch = opts.pitch || 1.05;
      let done = false; const fin = () => { if (!done) { done = true; res(); } };
      u.onend = fin; u.onerror = fin; setTimeout(fin, 1200 + text.length * 90);
      speechSynthesis.speak(u);
    });
  }
};

/* ---------- sfx ---------- */
const SFX = {
  ctx: null,
  init() { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} },
  tone(f, d = 0.15, type = 'sine', vol = 0.15, at = 0) { if (!this.ctx) return; const t = this.ctx.currentTime + at; const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d); o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + d); },
  chime() { this.tone(660, .18); this.tone(990, .25, 'sine', .12, .09); },
  whoosh() { if (!this.ctx) return; const t = this.ctx.currentTime; const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.type = 'sawtooth'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(880, t + .35); g.gain.setValueAtTime(.06, t); g.gain.exponentialRampToValueAtTime(.001, t + .4); o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + .4); },
  hit() { this.tone(120, .3, 'square', .12); this.tone(80, .35, 'triangle', .15, .05); },
  soft() { this.tone(440, .12, 'triangle', .08); }
};

/* ---------- speech recognition (Web Speech API) ---------- */
const Rec = {
  SR: window.SpeechRecognition || window.webkitSpeechRecognition || null,
  stream: null, track: null, active: null,
  async enable() {
    if (!this.SR) return 'unsupported';
    if (!window.isSecureContext) return 'insecure';
    try { this.stream = await navigator.mediaDevices.getUserMedia({ audio: true }); this.track = this.stream.getAudioTracks()[0]; return 'ok'; }
    catch (e) { return 'refused'; }
  },
  /* Listen once. Resolves { alts:[{transcript,confidence}] } or { silence:true } or { error }. */
  listen(timeoutMs = 7000) {
    return new Promise(resolve => {
      const r = new this.SR(); r.lang = 'en-US'; r.maxAlternatives = 5; r.interimResults = false; r.continuous = false;
      let settled = false, got = null; const t0 = performance.now();
      const finish = (v) => { if (settled) return; settled = true; clearTimeout(timer); try { r.abort(); } catch (e) {} this.active = null; setMic(false); resolve(v); };
      const timer = setTimeout(() => finish(got || { silence: true }), timeoutMs);
      r.onresult = (ev) => { const res = ev.results[0]; const alts = []; for (let i = 0; i < res.length; i++) alts.push({ transcript: res[i].transcript, confidence: res[i].confidence }); dlog('🎤', alts.map(a => `${a.transcript}(${(a.confidence || 0).toFixed(2)})`).join(' | ')); finish({ alts }); };
      r.onerror = (ev) => { if (ev.error === 'no-speech' || ev.error === 'aborted') return; dlog('rec error', ev.error); finish({ error: ev.error }); };
      r.onend = () => { if (!settled && performance.now() - t0 < timeoutMs - 400) { try { start(); } catch (e) { finish({ silence: true }); } } };
      const start = () => { try { this.track ? r.start(this.track) : r.start(); } catch (e) { r.start(); } };
      this.active = r; setMic(true);
      try { start(); } catch (e) { finish({ error: 'start-failed' }); }
    });
  }
};
function setMic(on) { const m = document.querySelector('.mic'); if (m) { m.classList.toggle('on', on); m.querySelector('span').textContent = on ? 'Listening…' : 'Mic'; } }

/* ---------- overlay helpers ---------- */
function showPanel(...kids) { const p = $('#panel'); p.innerHTML = ''; p.append(...kids); $('#overlay').classList.add('show'); return p; }
function hidePanel() { $('#overlay').classList.remove('show'); $('#panel').innerHTML = ''; }
function setPrompt(text) { const p = $('#panel .prompt'); if (p) p.textContent = text; }

/* ---------- card DOM ---------- */
function cardEl(id, extra = '') {
  const d = CARD_DEFS[id];
  const c = h('div', { class: `card ${d.type} ${extra}`, 'data-id': id },
    h('div', { class: 'tag' }, d.type === 'digraph' ? 'digraph' : d.type),
    h('div', { class: 'glyph' }, id),
    h('div', { class: 'dmg' }, '⚡' + d.dmg));
  if (d.fx) c.append(h('div', { class: 'fx', title: FX[d.fx].label }, FX[d.fx].icon));
  return c;
}

/* =====================================================================
   Trace step (spec: Reading acts → Trace)
   ===================================================================== */
function buildTraceSVG(letter) {
  const svg = el('svg', { viewBox: '-14 -14 128 228' });
  const lines = el('g', { class: 'lines' }, svg);
  for (const [y, cls] of [[0, ''], [50, ''], [150, 'base'], [200, '']]) el('line', { x1: -14, x2: 114, y1: y, y2: y, class: cls }, lines);
  const guide = el('g', { class: 'guide' }, svg);
  letter.strokes.forEach((s, i) => { if (s.isDot) el('circle', { cx: s.start[0], cy: s.start[1], r: 8, class: 'dotg', 'data-i': i }, guide); else el('path', { d: s.d, 'data-i': i }, guide); });
  el('g', { class: 'anim' }, svg);
  el('g', { class: 'ink' }, svg);

async function coinFlip() {
  const first = rng() < 0.5 ? 'me' : 'opp';
  showPanel(h('h2', {}, 'Coin flip'), h('div', { class: 'prompt', style: 'font-size:60px' }, '🪙'));
  await sleep(900); const txt = first === 'me' ? 'You go first!' : 'Rook goes first.';
  setPrompt(txt); await Voice.say(txt); await sleep(500); hidePanel(); return first;
}
async function start() {
  newGame(); setSlot(null); msg(''); actions(); render();
  const first = await coinFlip(); loop(first);
}
function intro() {
  const status = h('div', { class: 'sub' }, SPEECH ? 'You will need the microphone. Chrome works best.' : 'Speech is off: you will tap instead of speaking.');
  showPanel(h('h2', {}, '⚔️ Card Battle: Phase 2'), h('div', { class: 'prompt' }, 'Trace a card to pick it up. Say its name to place it. Say its sound to blast Rook!'),
    h('div', { class: 'sub', style: 'margin-bottom:10px' }, 'When Rook plays a card, you can defend by saying its sound, and steal it.'), status,
    h('div', { class: 'rowbtns' }, btn('Start battle', async () => {
      SFX.init(); Voice.init();
      if (SPEECH) { const r = await Rec.enable(); dlog('mic', r); if (r !== 'ok') { SPEECH = false; status.textContent = 'No microphone (' + r + '). Playing with taps.'; await sleep(1200); } }
      hidePanel(); start();
    })));
}
loadEngines().then(intro).catch(e => { showPanel(h('h2', {}, 'Could not load'), h('div', { class: 'sub' }, String(e) + ' (open over http, not file://)')); });
window.__game = { G, TE: () => TE, CARD_DEFS };
</script>
</body>
</html>
